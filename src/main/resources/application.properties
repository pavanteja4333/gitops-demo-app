# Database Connection Properties
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:demodb}?sslmode=disable
spring.datasource.username=${DB_USER:dbadmin}
spring.datasource.password=${DB_PASSWORD:Password123!}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema initialization
spring.sql.init.mode=always

# Hikari Connection Pool Resiliency
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.example.gitopsdemoapp=INFO
