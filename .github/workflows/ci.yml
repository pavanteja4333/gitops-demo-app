name: CI/CD GitOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Converts repository owner to lowercase for registry path compatibility
  IMAGE_NAME: ${{ github.repository_owner }}/gitops-demo-app
  # Target infrastructure repository name
  INFRA_REPO: ${{ github.repository_owner }}/gitops-demo-infra

jobs:
  test:
    name: Run Application Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests
        run: mvn test

  build-and-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v-${{ github.sha }}

  deploy-dev:
    name: Deploy to Dev
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infra Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.GITOPS_INFRA_PAT }}
          path: infra-repo

      - name: Update Image Tag in Helm values-dev.yaml
        run: |
          cd infra-repo
          sed -i 's/tag: .*/tag: "v-${{ github.sha }}"/' helm/app-chart/values-dev.yaml

      - name: Commit and Push Changes to Infra Repo
        run: |
          cd infra-repo
          git config --global user.name "GitHub Actions CI"
          git config --global user.email "actions@github.com"
          git add helm/app-chart/values-dev.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(dev): deploy v-${{ github.sha }} to dev [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected, skipping commit."
          fi

  deploy-staging:
    name: Deploy to Staging
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infra Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.GITOPS_INFRA_PAT }}
          path: infra-repo

      - name: Update Image Tag in Helm values-staging.yaml
        run: |
          cd infra-repo
          sed -i 's/tag: .*/tag: "v-${{ github.sha }}"/' helm/app-chart/values-staging.yaml

      - name: Commit and Push Changes to Infra Repo
        run: |
          cd infra-repo
          git config --global user.name "GitHub Actions CI"
          git config --global user.email "actions@github.com"
          git add helm/app-chart/values-staging.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(staging): promote v-${{ github.sha }} to staging [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected, skipping commit."
          fi

  open-prod-pr:
    name: Open Production Promotion PR
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infra Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.GITOPS_INFRA_PAT }}
          path: infra-repo

      - name: Create Production Promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITOPS_INFRA_PAT }}
        run: |
          cd infra-repo
          BRANCH_NAME="promote-to-prod-${{ github.sha }}"
          git checkout -b $BRANCH_NAME
          
          sed -i 's/tag: .*/tag: "v-${{ github.sha }}"/' helm/app-chart/values-prod.yaml
          
          git config --global user.name "GitHub Actions CI"
          git config --global user.email "actions@github.com"
          git add helm/app-chart/values-prod.yaml
          
          git commit -m "chore(prod): promote app to v-${{ github.sha }}"
          git push origin $BRANCH_NAME
          
          gh pr create \
            --title "🚀 Promote v-${{ github.sha }} to Production" \
            --body "This PR promotes the application to version v-${{ github.sha }} in the Production environment. After merging this PR, manual sync in ArgoCD is required to rollout." \
            --repo "${{ env.INFRA_REPO }}" \
            --head "$BRANCH_NAME" \
            --base "main"
