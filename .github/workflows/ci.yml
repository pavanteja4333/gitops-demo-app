name: CI/CD GitOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Converts repository owner to lowercase for registry path compatibility
  IMAGE_NAME: ${{ github.repository_owner }}/gitops-demo-app
  # Target infrastructure repository name
  INFRA_REPO: ${{ github.repository_owner }}/gitops-demo-infra

jobs:
  test:
    name: Run Application Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests
        run: mvn test

  build-and-push:
    name: Build & Push Image, Update GitOps Config
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v-${{ github.sha }}

      - name: Checkout Infra Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          # Requires a GitHub Personal Access Token (PAT) with write access to the infra repo
          token: ${{ secrets.GITOPS_INFRA_PAT }}
          path: infra-repo

      - name: Update Image Tag in Helm values.yaml
        run: |
          cd infra-repo
          # Specific sed: find repository ending with gitops-demo-app, go to next line, and replace the tag
          sed -i '/repository: .*gitops-demo-app/{n;s/tag: .*/tag: "v-${{ github.sha }}"/}' helm/app-chart/values.yaml

      - name: Commit and Push Changes to Infra Repo
        run: |
          cd infra-repo
          git config --global user.name "GitHub Actions CI"
          git config --global user.email "actions@github.com"
          git add helm/app-chart/values.yaml
          # Only commit and push if values.yaml actually changed
          if ! git diff --cached --quiet; then
            git commit -m "chore(infra): update app image tag to v-${{ github.sha }} [skip ci]"
            git push origin main
          else
            echo "No changes detected, skipping commit."
          fi
